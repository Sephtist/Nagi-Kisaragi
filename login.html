<form id="login-form">

    <label for="pin">
        PERSONAL ACCESS PIN
    </label>

    <input
        type="password"
        id="pin"
        name="pin"
        inputmode="numeric"
        autocomplete="off"
        maxlength="10"
        required
    >

    <button type="submit">
        AUTHENTICATE
    </button>

</form>

<p id="login-message"></p>
